name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Check resource loading
        run: dotnet run --project ../tests/ResourceLoader.Tests/ResourceLoader.Tests.csproj --configuration Release

      - name: Build Windows release
        run: bash build.sh win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: app/bin/win-x64.zip
          compression-level: 0
          if-no-files-found: error
